# WIYN 0.9m HDI — night of 2017-06-29

night_id: "2017JUN29"
instrument: "hdi"
telescope: "WIYN0.9m"

paths:
  raw_dir: "../data/2017JUN29/raw"
  output_dir: "../data/2017JUN29/reduced"
  masters_dir: "../data/2017JUN29/reduced/masters"

fits:
  # HDI stores the detector image in extension 'xy00' (index 1)
  image_hdu: "xy00"
  unit: "adu"

# Header keywords used by this instrument
keywords:
  obstype: "OBSTYPE"
  exptime: "EXPTIME"
  object: "OBJECT"
  filter1: "FILTER1"
  filter2: "FILTER2"
  biassec: "BIASSEC"
  datasec: "DATASEC"

obstypes:
  bias: "BIAS"
  flat: "FLAT"
  science: "OBJECT"

# Overscan / trim — from HDI image-extension headers
overscan:
  median: true

# No dark frames available for this night
darks:
  enabled: false

combine:
  bias:
    method: "average"
    sigma_clip: true
    sigma_clip_low: 5
    sigma_clip_high: 5
  flat:
    method: "average"
    scale: "inv_median"
    sigma_clip: true
    sigma_clip_low: 5
    sigma_clip_high: 5

# Map HDI filter-wheel IDs → short filter names (from dome-flat OBJECT labels)
filter_map:
  "107,200": "6580"
  "107,202": "u"
  "107,203": "g"
  "107,204": "r"
  "107,205": "i"
  "107,206": "z"
  "102,207": "V"
  "103,207": "R"
  "104,207": "I"
  "106,207": "Wash-M"
  "105,207": "Wash-C"
  "101,207": "Wash-51"
  "100,207": "OIII"

science:
  # Products: {night_id}.{OBJECT}.{filter}[.NN].fits
  include_objects: []
  exclude_object_substrings:
    - "rfocus"
    - "junk"
    - "focus"

# Offline WCS via astrometry.net solve-field (after ccd reduce)
wcs:
  enabled: true
  solver: "astrometry-net"
  solve_field: "solve-field"
  index_dir: null
  scale_arcsec_per_pix: 0.43
  scale_tol_frac: 0.05
  radius_deg: 1.0
  downsample: 2
  overwrite: false
  timeout_sec: 300
  verbose: true
  show_solver_output: false   # true = stream every solve-field line live
  include_objects: []         # e.g. [APSExS-F-1]; empty = all
