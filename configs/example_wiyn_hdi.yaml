# WIYN 0.9m HDI — night of 2017-06-29

night_id: "2017JUN29"
instrument: "hdi"
telescope: "WIYN0.9m"

paths:
  raw_dir: "../data/2017JUN29/raw"
  output_dir: "../data/2017JUN29/reduced"
  masters_dir: "../data/2017JUN29/reduced/masters"

fits:
  # HDI stores the detector image in extension 'xy00' (index 1)
  image_hdu: "xy00"
  unit: "adu"

# Header keywords used by this instrument
keywords:
  obstype: "OBSTYPE"
  exptime: "EXPTIME"
  object: "OBJECT"
  filter1: "FILTER1"
  filter2: "FILTER2"
  biassec: "BIASSEC"
  datasec: "DATASEC"

obstypes:
  bias: "BIAS"
  flat: "FLAT"
  science: "OBJECT"

# Overscan / trim — from HDI image-extension headers
overscan:
  median: true

# No dark frames available for this night
darks:
  enabled: false

combine:
  bias:
    method: "average"
    sigma_clip: true
    sigma_clip_low: 5
    sigma_clip_high: 5
  flat:
    method: "average"
    scale: "inv_median"
    sigma_clip: true
    sigma_clip_low: 5
    sigma_clip_high: 5

# Map HDI filter-wheel IDs → short filter names (from dome-flat OBJECT labels)
filter_map:
  "107,200": "6580"
  "107,202": "u"
  "107,203": "g"
  "107,204": "r"
  "107,205": "i"
  "107,206": "z"
  "102,207": "V"
  "103,207": "R"
  "104,207": "I"
  "106,207": "Wash-M"
  "105,207": "Wash-C"
  "101,207": "Wash-51"
  "100,207": "OIII"

science:
  # Products: {night_id}.{OBJECT}.{filter}[.NN].fits
  # Frames whose OBJECT contains any of these (case-insensitive) are skipped
  # for bias, flats, and science. "junk" is always excluded even if omitted.
  include_objects: []
  exclude_object_substrings:
    - "rfocus"
    - "junk"
    - "focus"

# Additive fringe (airglow); build after reduce, apply optional.
# Tunables live in src/ccd_pipeline/fringe.py::DEFAULT_FRINGE (full comments).
# Nothing is interpolated or smoothed; pixels with no unmasked sample are 0
# (no correction) and are counted in the NSAMP extension / preview.
# Quick dial:
#   ghosts remain  → ↑ dilate_pix a little (costs no-data pixels), or more frames
#   no-data pixels → ↓ dilate_pix
#   reject_high > 0 with few frames biases the master bright around stars — keep 0
fringe:
  filters: ["z", "i"]          # which filters get masters
  min_frames: 3                # need at least this many inputs (≥3 practical)
  select: all                  # blanks | science | all
  blank_substrings: ["blank", "sky", "empty"]
  blanks_fallback: all         # if too few blanks: all | science | none
  airmass_tol: 0.15            # ± AIRMASS about median (0=off)
  time_tol_hours: 1.5          # ± hours about median DATE-OBS (0=off)
  sky_tol_frac: 0.3            # |sky-med|/med (0=off)
  min_sky: 40.0                # drop shallow frames, ADU (0=off)
  min_exptime: 20.0            # drop short exposures, sec (0=off)
  star_nsigma: 5.0             # core mask σ (keep high so fringe survives)
  wing_nsigma: 2.5             # connected soft-wing growth σ
  dilate_pix: 16               # hard dilate radius (px); big → more no-data pixels
  star_smooth_sigma: 0.0       # detect on blurred copy; usually 0
  reject_high: 0               # 0 = masked median (unbiased); >0 only with ≥8 frames
  hole_fill: data              # data = cores-only re-measure, else 0 | zero
  residual_nsigma: 0.0         # 0 = off; >0 flags compact ghosts and sets them to 0
  residual_smooth_sigma: 15.0  # large-scale model σ for ghost finder
  residual_dilate: 8           # dilate residual-ghost mask (px)

# Offline WCS via astrometry.net solve-field (after ccd reduce)
wcs:
  enabled: true
  solver: "astrometry-net"
  solve_field: "solve-field"
  index_dir: null
  scale_arcsec_per_pix: 0.43
  scale_tol_frac: 0.05
  radius_deg: 1.0
  downsample: 2
  overwrite: false
  timeout_sec: 300
  verbose: false              # true = --verbose (huge solve-field logs)
  show_solver_output: false   # true = stream every solve-field line live
  include_objects: []         # e.g. [APSExS-F-1]; empty = all
